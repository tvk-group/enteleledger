  <text x="62" y="274" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="59" font-weight="700" letter-spacing="-2"><tspan x="62">From event to evidence.</tspan><tspan x="62" y="345" fill="#a9bed3">From evidence to trust.</tspan></text>
